<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · Luna Wick Co.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container py-2">
    <a class="navbar-brand" href="/index.html">Luna Wick Co.</a>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="/customize.html">Customize</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row g-4">
    <div class="col-lg-8">
      <section class="surface p-4">
        <h3>Admin control panel</h3>
        <div id="adminAccessMessage" class="my-3 small-muted">Checking administrator status…</div>

        <div class="mb-3">
          <button id="refreshAdminBtn" class="btn btn-outline-terra">Refresh listeners</button>
        </div>

        <h4 class="mt-4">Orders</h4>
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Order ID</th><th>User</th><th>Status</th><th>Total</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="adminOrdersBody"><tr><td colspan="6">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="surface p-4 mt-4">
        <h4>Gallery moderation</h4>
        <div id="adminGalleryList">Loading gallery…</div>
      </section>

    </div>

    <aside class="col-lg-4">
      <div class="surface p-4">
        <h5>Stats</h5>
        <div>Orders: <span id="adminOrderCount">—</span></div>
        <div>Pending verification: <span id="adminPendingCount">—</span></div>
        <div class="mt-3">
          <button id="logoutBtn" class="btn btn-outline-terra">Sign out</button>
        </div>
      </div>
    </aside>
  </div>
</main>

<script type="module">
import './js/firebase.js';
import './js/admin.js';
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
