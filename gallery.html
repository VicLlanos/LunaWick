<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Luna Wick Co.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container py-2">
    <a class="navbar-brand" href="/index.html">Luna Wick Co.</a>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/customize.html">Customize</a></li>
        <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <header class="d-flex justify-content-between align-items-end mb-4">
    <div>
      <div class="eyebrow">The Luna Wick edit</div>
      <h2 class="h2 mt-2 mb-1">Made to be seen. Made to be felt.</h2>
      <p class="small-muted">Studio photographs and customer-submitted images. Admins can upload new images below.</p>
    </div>
    <div>
      <button id="openUpload" class="btn btn-outline-terra">Upload (admins only)</button>
    </div>
  </header>

  <div id="publicGallery" class="row g-3 mb-5">
    <div class="col-12 text-center small-muted">Loading gallery…</div>
  </div>

  <section class="surface p-4" id="uploadSection" style="display:none;">
    <h4>Upload image</h4>
    <form id="galleryUploadForm">
      <div class="mb-3">
        <label class="form-label">Image</label>
        <input id="galleryImageFile" type="file" accept="image/*" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input id="galleryTitle" class="form-control" maxlength="120">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea id="galleryDescription" rows="3" class="form-control"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button id="galleryUploadBtn" class="btn btn-terra">Upload</button>
        <button id="cancelUpload" type="button" class="btn btn-outline-terra">Cancel</button>
      </div>
      <div id="galleryUploadStatus" class="mt-2 small-muted"></div>
    </form>
  </section>

</main>

<script type="module">
import './js/firebase.js';
import './js/gallery.js';
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
